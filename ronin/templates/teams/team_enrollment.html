{% extends "base.html" %}
{% block title %}Clan Enrollment{% endblock %}
{% block content %}
<main class="max-w-7xl mx-auto px-4 sm:px-8 lg:px-12 py-14 lg:py-20 min-h-screen">
  <div class="reveal text-center">
    <span class="font-kanji text-5xl text-[#E63946] torch-pulse block mb-4">隊</span>
    <h1 class="font-heading text-3xl font-black uppercase tracking-[0.25em] text-[#F5F2EB] mb-4">Clan enrollment</h1>
    <p class="font-mono2 text-sm text-[#A1A1AA] mb-8">Choose your path</p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-lg mx-auto">
      <a href="{{ url_for('teams.new') }}" class="trial-card bg-[#121215] border border-white/10 p-8 text-center hover:border-[rgba(230,57,70,0.5)]">
        <span class="font-kanji text-4xl text-[#D4AF37] block mb-4">創</span>
        <h3 class="font-heading text-lg font-bold text-[#F5F2EB] mb-2">Found Clan</h3>
        <p class="font-mono2 text-xs text-[#71717A]">Create a new clan and lead</p>
      </a>
      <a href="{{ url_for('teams.join') }}" class="trial-card bg-[#121215] border border-white/10 p-8 text-center hover:border-[rgba(230,57,70,0.5)]">
        <span class="font-kanji text-4xl text-[#D4AF37] block mb-4">合</span>
        <h3 class="font-heading text-lg font-bold text-[#F5F2EB] mb-2">Join Clan</h3>
        <p class="font-mono2 text-xs text-[#71717A]">Enter an existing clan</p>
      </a>
    </div>
  </div>
</main>
{% endblock %}
